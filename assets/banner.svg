<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a8ff78"/>
      <stop offset="100%" stop-color="#78ffd6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c9ff"/>
      <stop offset="100%" stop-color="#e81cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #e0e6ed;
    }
    .tag {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #ffffff;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 1;
    }
    
    /* Subtle background dynamic floaters placed out of text way */
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }

    .bg-node-1 { animation: float1 6s ease-in-out infinite; }
    .bg-node-2 { animation: float2 8s ease-in-out infinite; }
    .pulse { animation: pulseGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>

  <!-- Background Grid -->
  <g>
    <line x1="100" y1="0" x2="100" y2="320" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="320" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="320" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="320" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="320" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="320" class="grid-line" />
    
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="140" x2="1200" y2="140" class="grid-line" />
    <line x1="0" y1="220" x2="1200" y2="220" class="grid-line" />
  </g>

  <!-- Background Decorative Dynamic Elements (Positioned safely on right side & background) -->
  <g class="bg-node-1" transform="translate(850, 40)">
    <circle cx="120" cy="100" r="90" fill="url(#accentGrad)" opacity="0.15" class="pulse" />
    <rect x="50" y="30" width="180" height="110" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <path d="M 70 110 L 110 70 L 140 90 L 200 40" fill="none" stroke="#78ffd6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="200" cy="40" r="5" fill="#a8ff78"/>
  </g>

  <g class="bg-node-2" transform="translate(1000, 160)">
    <rect x="0" y="0" width="140" height="90" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(168,255,120,0.2)" stroke-width="1"/>
    <circle cx="30" cy="30" r="14" fill="rgba(120,255,214,0.2)"/>
    <path d="M26 30 L30 34 L36 26" stroke="#78ffd6" stroke-width="2" fill="none"/>
    <rect x="55" y="22" width="60" height="6" rx="3" fill="rgba(255,255,255,0.4)"/>
    <rect x="55" y="34" width="40" height="5" rx="2" fill="rgba(255,255,255,0.2)"/>
  </g>

  <!-- Left Accent Bar -->
  <rect x="60" y="60" width="6" height="200" rx="3" fill="url(#textGrad)" />

  <!-- Main Foreground Content (Safely clear of dynamic background elements) -->
  <g transform="translate(90, 0)">
    <!-- Decorative Category Pills -->
    <g transform="translate(0, 62)">
      <rect x="0" y="0" width="150" height="26" rx="13" fill="rgba(168, 255, 120, 0.15)" stroke="rgba(168, 255, 120, 0.4)" stroke-width="1"/>
      <text x="75" y="17" text-anchor="middle" class="tag" fill="#a8ff78">🌾 AGTECH &amp; SAAS</text>
      
      <rect x="160" y="0" width="170" height="26" rx="13" fill="rgba(120, 255, 214, 0.15)" stroke="rgba(120, 255, 214, 0.4)" stroke-width="1"/>
      <text x="245" y="17" text-anchor="middle" class="tag" fill="#78ffd6">🚜 OPEN SOURCE</text>
      
      <rect x="340" y="0" width="150" height="26" rx="13" fill="rgba(64, 201, 255, 0.15)" stroke="rgba(64, 201, 255, 0.4)" stroke-width="1"/>
      <text x="415" y="17" text-anchor="middle" class="tag" fill="#40c9ff">⭐ AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title" filter="url(#glow)">Awesome Farm Management Software</text>
    
    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">A curated directory of top SaaS platforms, open-source agriculture software, and smart farming tools.</text>
    
    <!-- Feature Highlights / Sub-bar -->
    <g transform="translate(0, 220)">
      <text x="0" y="15" font-family="'Segoe UI', sans-serif" font-size="14" fill="#a0aec0">
        🌱 Field Records &nbsp;•&nbsp; 🚜 Precision Ag &nbsp;•&nbsp; 🛰️ Crop Analytics &nbsp;•&nbsp; 📊 Inventory &amp; Livestock
      </text>
    </g>
  </g>
</svg>
